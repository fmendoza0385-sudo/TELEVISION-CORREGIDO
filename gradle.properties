kotlin.code.style=official

# --- Configuración de licencias (NO son secretos: URL pública y CLAVE PÚBLICA) ---
# Se pueden definir aquí, o mejor como Variables de GitHub Actions / variables de entorno:
#   LUKKA_LICENSE_API_URL    = https://tu-dominio.com/lukka/api
#   LUKKA_LICENSE_PUBLIC_KEY = (base64 que imprime server/tools/generate_keys.php)
# Si quedan vacías, la app compila pero mostrará "servicio de licencias no configurado".
# NUNCA escribas aquí claves privadas, contraseñas ni códigos de activación.
LUKKA_LICENSE_API_URL=
LUKKA_LICENSE_PUBLIC_KEY=

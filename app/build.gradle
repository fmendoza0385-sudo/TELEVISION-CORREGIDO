import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Leer archivo JSON si existe (en la raíz del proyecto o dentro de app/)
def configFile = rootProject.file("lukka-config.json")
if (!configFile.exists()) {
    configFile = file("lukka-config.json")
}
def configJson = configFile.exists() ? new JsonSlurper().parseText(configFile.text) : [:]

def apiUrl = configJson.license_api_url ?: System.getenv("LICENSE_API_URL") ?: ""
def publicKey = configJson.license_public_key ?: System.getenv("LICENSE_PUBLIC_KEY") ?: ""

android {
    namespace 'com.grmconexion.lukka'
    compileSdk 34

    defaultConfig {
        applicationId "com.grmconexion.lukka"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Inyección automática desde tu JSON o desde GitHub Secrets
        buildConfigField "String", "LICENSE_API_URL", "\"${apiUrl}\""
        buildConfigField "String", "LICENSE_PUBLIC_KEY", "\"${publicKey}\""

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }
    // ... resto de tu build.gradle igual
